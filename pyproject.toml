[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "blink"
version = "0.1.0.dev0"
description = "Zero-config, read-only data quality diagnostics for CSV and Parquet."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "polars>=1.0,<2",
    "numpy>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "typer>=0.16,<1",
    "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
blink = "blink.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/blink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
