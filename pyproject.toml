[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "blink-data-lint"
version = "0.2.2"
description = "Zero-config, read-only data quality diagnostics for CSV and Parquet."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gianni Luigi Messina"}]
keywords = ["data-quality", "csv", "parquet", "cli", "anomaly-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "polars>=1.44.2,<2",
    "numpy>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "typer>=0.16,<1",
    "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
blink = "blink_data_lint.cli:app"

[project.urls]
Homepage = "https://github.com/Gianni300x/blink"
Repository = "https://github.com/Gianni300x/blink"
Issues = "https://github.com/Gianni300x/blink/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/blink_data_lint"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/README.md", "/LICENSE", "/scripts/evaluate_alerts.py", "/scripts/evaluate_public_data.py", "/scripts/evaluate_dirty_clean.py", "/scripts/evaluate_numeric_cases.py", "/scripts/stress_cli.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
