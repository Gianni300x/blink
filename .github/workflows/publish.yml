name: Publicar en PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publication
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
    steps:
      - name: Exigir CI exitosa para este mismo commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$GITHUB_SHA" -f event=push -f status=success > ci-runs.json
          python3 - <<'PY'
          import json, os
          runs = json.load(open('ci-runs.json'))['workflow_runs']
          run = next(r for r in runs if r['head_sha'] == os.environ['GITHUB_SHA'] and r['head_branch'] == 'main' and r['event'] == 'push' and r['conclusion'] == 'success')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run_id={run['id']}\n")
          PY

  publish:
    name: Publicar distribución verificada
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/blink-data-lint
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
          run-id: ${{ needs.verify.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publicar con Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
